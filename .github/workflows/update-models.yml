name: Update AI Models Data

on:
  schedule:
    # Runs daily at 6:00 AM UTC (11:30 AM IST)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Needed to commit changes back to repo

jobs:
  update-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        id: update
        run: node scripts/update-models.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/models.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected — skipping commit."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in data/models.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          git commit -m "chore: auto-update AI model pricing from OpenRouter API

          Generated by GitHub Actions workflow (update-models.yml)
          Source: https://openrouter.ai/api/v1/models
          Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "✅ Committed and pushed model updates."

      - name: Summary
        run: |
          echo "## AI Models Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.changes.outputs.has_changes }}" == "true" ]]; then
            echo "✅ Model pricing data was updated and pushed." >> $GITHUB_STEP_SUMMARY
            echo "Vercel will auto-deploy from the new commit." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected — all pricing is up to date." >> $GITHUB_STEP_SUMMARY
          fi
